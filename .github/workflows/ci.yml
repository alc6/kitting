name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build CSS (Tailwind)
        run: npm run css
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test (workerd + D1)
        run: npm test
      - name: Test the release and deploy scripts (Node)
        run: npm run test:scripts
      - name: Migrations are up to date with the schema
        run: |
          npx drizzle-kit generate --name ci-check
          if [ -n "$(git status --porcelain -- migrations)" ]; then
            echo "::error::src/db/schema.ts changed without a migration. Run: npm run db:generate"
            git status --porcelain -- migrations
            exit 1
          fi

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.5
      - name: Format
        run: terraform fmt -check -recursive -diff infra/terraform
      - name: Validate the module
        working-directory: infra/terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: Validate the example against this version of the module
        run: |
          # The example points at a published tag; check it against the module in this checkout.
          cp -r infra/terraform/examples/basic infra/terraform/examples/validate
          cd infra/terraform/examples/validate
          sed -i '/github.com/s|"[^"]*"|"../.."|' main.tf
          terraform init -backend=false -input=false
          terraform validate
