# Manually triggered deploy. Configure in GitHub → Settings → Secrets and variables → Actions:
#   Secrets:   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   Variables: KITTING_DOMAIN, D1_DATABASE_ID, TEAM_DOMAIN, ACCESS_AUD, ADMIN_EMAILS
#              optional: WORKER_NAME, D1_DATABASE_NAME, DEFAULT_LOCALE, CURRENCY
name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test
      - name: Generate wrangler.jsonc from repository variables
        run: npm run config
        env:
          KITTING_DOMAIN: ${{ vars.KITTING_DOMAIN }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          TEAM_DOMAIN: ${{ vars.TEAM_DOMAIN }}
          ACCESS_AUD: ${{ vars.ACCESS_AUD }}
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          DEFAULT_LOCALE: ${{ vars.DEFAULT_LOCALE }}
          CURRENCY: ${{ vars.CURRENCY }}
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote
      - name: Deploy Worker
        run: npx wrangler deploy
